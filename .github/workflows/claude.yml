name: Claude Code review

# Runs when a comment mentions @claude on a PR or issue. The automatic
# review request on new PRs is posted by request-code-review.yml; that
# comment is authored by github-actions[bot], so allowed_bots must include
# it or the action would ignore the mention.
# issue_comment workflows execute from the default branch, so this file
# must be merged to main before mentions (automatic or manual) work.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Required by claude-code-action to exchange an OIDC token for
      # GitHub App credentials used to post the review.
      id-token: write
    steps:
      # Pinned to commit SHAs (not mutable tags) per supply-chain hardening
      # guidance for third-party actions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: github-actions[bot]
