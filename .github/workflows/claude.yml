name: Claude Code review

# Runs only when a comment mentions @claude on a PR or issue. The Claude
# GitHub App alone can't do this — issue_comment workflows execute from the
# default branch, so this file must be merged to main before mentions work.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Required by claude-code-action to exchange an OIDC token for
      # GitHub App credentials used to post the review.
      id-token: write
    steps:
      # Pinned to commit SHAs (not mutable tags) per supply-chain hardening
      # guidance for third-party actions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Default review request. A @claude mention still triggers the run;
          # this prompt is what Claude actually follows, so reviewers do not
          # need to paste the rubric into every comment.
          prompt: |
            Please do a code review.

            Evaluation Criteria
            Evaluate the following areas:

            Correctness: Does it correctly solve the stated issue?
            Code Quality: Is the implementation simple, reusable, and consistent with the existing codebase?
            Complexity: Is there any unnecessary complexity or overclaim?
            Safety: Could it introduce breaking changes or regressions?

            For each area, provide:

            Score (/10)
            One-sentence justification

            Summary sections:

            Must Fix
            Should Fix
            Nice to Have

            **Base conclusions only on evidence in the PR. Do not speculate.
